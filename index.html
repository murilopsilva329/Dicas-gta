```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10120f">
  <title>Dicas GTA 5</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #10120f;
      color: #f5f5f0;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 28px 20px 22px;
      background: linear-gradient(135deg, #171b14, #334422);
      border-bottom: 1px solid #343a2b;
    }

    .container {
      width: min(100%, 720px);
      margin: auto;
    }

    .eyebrow {
      color: #b7d85b;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h1 { margin: 8px 0 4px; font-size: 32px; }
    header p { margin: 0; color: #c5c8bf; }
    main { padding: 20px 20px 90px; }

    .search {
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 16px;
      color: white;
      background: #1c201a;
      border: 1px solid #3b4234;
      border-radius: 12px;
      font-size: 16px;
    }

    .tabs { display: flex; gap: 10px; margin-bottom: 22px; }

    .tab {
      flex: 1;
      padding: 12px 8px;
      color: #e7e9e2;
      background: #20241d;
      border: 1px solid #3b4234;
      border-radius: 10px;
      font-weight: bold;
      font-size: 14px;
    }

    .tab.active { color: #15180f; background: #b7d85b; }

    h2 { margin: 0 0 12px; font-size: 21px; }

    .card {
      margin-bottom: 12px;
      padding: 16px;
      background: #1b1f19;
      border: 1px solid #333a2e;
      border-radius: 14px;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .card h3 { margin: 0 0 8px; font-size: 17px; }
    .card p { margin: 0; color: #c5c8bf; line-height: 1.5; }

    .favorite {
      padding: 4px;
      color: #b7d85b;
      background: transparent;
      border: 0;
      font-size: 24px;
    }

    .empty { padding: 18px; color: #c5c8bf; text-align: center; }

    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 12px;
      background: #151813;
      border-top: 1px solid #343a2b;
    }

    nav button {
      min-width: 130px;
      padding: 10px;
      color: #e7e9e2;
      background: transparent;
      border: 0;
      font-size: 15px;
    }

    nav button.active { color: #b7d85b; font-weight: bold; }
  </style>
</head>

<body>
  <header>
    <div class="container">
      <div class="eyebrow">Guia de Los Santos</div>
      <h1>DICAS GTA 5</h1>
      <p>Escolha um modo e encontre sua próxima dica.</p>
    </div>
  </header>

  <main class="container">
    <input id="search" class="search" type="search" placeholder="Buscar uma dica...">

    <div class="tabs">
      <button class="tab active" data-mode="historia">Modo História</button>
      <button class="tab" data-mode="online">GTA Online</button>
    </div>

    <h2 id="sectionTitle">Modo História</h2>
    <section id="tipsList"></section>
  </main>

  <nav>
    <button id="homeButton" class="active">⌂ Início</button>
    <button id="favoritesButton">☆ Favoritos</button>
  </nav>

  <script>
    const tips = [
      { mode: "historia", title: "Explore o mapa", text: "Passeie por Los Santos e pelo interior do mapa. Você pode encontrar atividades e eventos pelo caminho." },
      { mode: "historia", title: "Use as habilidades especiais", text: "Os protagonistas têm habilidades diferentes. Experimente cada uma para descobrir quando ela pode ajudar." },
      { mode: "historia", title: "Prepare-se para as missões", text: "Confira os objetivos e escolha armas e veículos adequados antes de começar uma missão." },
      { mode: "historia", title: "Faça atividades extras", text: "Além das missões principais, há atividades secundárias para explorar o jogo." },
      { mode: "online", title: "Jogue em equipe", text: "Em atividades cooperativas, combinar funções com seus amigos pode facilitar as missões." },
      { mode: "online", title: "Confira as atividades em destaque", text: "Veja no próprio jogo quais atividades e recompensas estão disponíveis." },
      { mode: "online", title: "Fique atento ao mapa", text: "Observe o que acontece ao seu redor, especialmente em atividades públicas." },
      { mode: "online", title: "Personalize seus equipamentos", text: "Organize veículos e equipamentos de acordo com as atividades que costuma jogar." }
    ];

    let currentMode = "historia";
    let currentPage = "home";
    let favorites = JSON.parse(localStorage.getItem("gta-favorites") || "[]");

    const list = document.getElementById("tipsList");
    const title = document.getElementById("sectionTitle");
    const search = document.getElementById("search");
    const tabs = document.querySelectorAll(".tab");

    function render() {
      const query = search.value.trim().toLowerCase();

      const shownTips = tips.filter(tip => {
        const rightMode = currentPage === "favorites"
          ? favorites.includes(tip.title)
          : tip.mode === currentMode;

        return rightMode &&
          (tip.title.toLowerCase().includes(query) ||
           tip.text.toLowerCase().includes(query));
      });

      title.textContent = currentPage === "favorites"
        ? "Dicas favoritas"
        : currentMode === "historia" ? "Modo História" : "GTA Online";

      list.innerHTML = "";

      if (!shownTips.length) {
        list.innerHTML = '<div class="empty">Nenhuma dica encontrada.</div>';
        return;
      }

      shownTips.forEach(tip => {
        const isFavorite = favorites.includes(tip.title);
        const card = document.createElement("article");
        card.className = "card";
        card.innerHTML = `
          <div class="card-top">
            <div><h3>${tip.title}</h3><p>${tip.text}</p></div>
            <button class="favorite">${isFavorite ? "★" : "☆"}</button>
          </div>`;

        card.querySelector(".favorite").addEventListener("click", () => {
          favorites = favorites.includes(tip.title)
            ? favorites.filter(item => item !== tip.title)
            : [...favorites, tip.title];

          localStorage.setItem("gta-favorites", JSON.stringify(favorites));
          render();
        });

        list.appendChild(card);
      });
    }

    tabs.forEach(tab => tab.addEventListener("click", () => {
      currentMode = tab.dataset.mode;
      currentPage = "home";
      tabs.forEach(item => item.classList.remove("active"));
      tab.classList.add("active");
      document.getElementById("homeButton").classList.add("active");
      document.getElementById("favoritesButton").classList.remove("active");
      render();
    }));

    search.addEventListener("input", render);

    document.getElementById("homeButton").addEventListener("click", () => {
      currentPage = "home";
      document.getElementById("homeButton").classList.add("active");
      document.getElementById("favoritesButton").classList.remove("active");
      render();
    });

    document.getElementById("favoritesButton").addEventListener("click", () => {
      currentPage = "favorites";
      document.getElementById("favoritesButton").classList.add("active");
      document.getElementById("homeButton").classList.remove("active");
      render();
    });

    render();
  </script>
</body>
</html>
